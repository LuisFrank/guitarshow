<div class="container-fluid py-5" id="GuitarScales">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <p class="section-label justify-content-center">Fretboard</p>
                <h2 class="guitarScale-title text-center">ESCALAS DE GUITARRA</h2>
                <div class="selection-badge text-center" *ngIf="currentNote">
                    <span class="sel-note">{{ currentNote }}</span>
                    <span class="sel-sep" *ngIf="currentScaleName"> · </span>
                    <span class="sel-scale" *ngIf="currentScaleName">{{ getSelectionLabel() }}</span>
                </div>
            </div>
    
            <div class="col-md-12 mb-3">
                <div class="row justify-content-between align-items-center g-2">

                    <!-- Tuning selector -->
                    <div class="col-auto">
                        <div class="fretboard-toolbar-label">Afinación</div>
                        <div class="btn-group" role="group">
                            <ng-container *ngFor="let key of tuningKeys">
                                <input type="radio" class="btn-check" name="tuning" [id]="'tuning-' + key" autocomplete="off"
                                    [checked]="selectedTuning === key" (click)="changeTuning(key)">
                                <label class="btn btn-outline-secondary btn-tuning" [for]="'tuning-' + key">
                                    {{ tunings[key].label }}
                                </label>
                            </ng-container>
                        </div>
                    </div>

                    <!-- Show all / clear -->
                    <div class="col-auto">
                        <div class="fretboard-toolbar-label">Notas</div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-secondary fretboard-action-btn"
                                    [class.active]="showAllNoteNames"
                                    (click)="toggleAllNoteNames()">Ver todo</button>
                            <button class="btn btn-sm btn-outline-secondary fretboard-action-btn"
                                    [class.active]="showDegrees"
                                    [disabled]="showAllNoteNames"
                                    (click)="toggleShowDegrees()">Grados</button>
                            <button class="btn btn-sm btn-outline-secondary fretboard-action-btn"
                                    (click)="clearFretboard()">Limpiar</button>
                        </div>
                    </div>

                    <!-- Degree highlight toggles -->
                    <div class="col-auto">
                        <div class="fretboard-toolbar-label">Destacar grados</div>
                        <div class="degree-toggles">
                            <button class="degree-btn d1"
                                [class.active]="degreeHighlights[1]"
                                (click)="toggleDegree(1)">I</button>
                            <button class="degree-btn d3"
                                [class.active]="degreeHighlights[3]"
                                (click)="toggleDegree(3)">III</button>
                            <button class="degree-btn d5"
                                [class.active]="degreeHighlights[5]"
                                (click)="toggleDegree(5)">V</button>
                            <button class="degree-btn d7"
                                [class.active]="degreeHighlights[7]"
                                (click)="toggleDegree(7)">VII</button>
                        </div>
                    </div>

                </div>
            </div>

            <div class="col-md-12">
                <div class="row">
                    <!-- <p class="text-justify">
                    El mundo de las escalas ha sido abordado desde diferentes aristas, y siempre
                    se ha reconocido en él un material vital para la creación e interpretación musical.
                    Sin embargo, no siempre es fácil desarrollar un plan de trabajo que nos permita,
                    en cualquiera de estos abordajes, una ruta clara y efectiva para manipular este
                    recurso musical, bien sea en la improvisación, la composición o la interpretación. 
                    </p>
                    <p class="text-justify">
                    Considerando las transformaciones técnicas y estéticas sucedidas en la música
                    hasta el día de hoy, el estudio de las escalas es aún un tema fundamental en la
                    formación y desarrollo del músico. Este campo de estudio traspasa aspectos tan
                    diversos como la teoría musical, la composición y particularmente, el de la interpretación instrumental
                    </p> -->
                </div>
         
                <div class="overflow-auto">   
                    <div #fretboard class="fretboard" [class.show-degrees]="showDegrees">
                      
                        <div id="fretNumber" class="d-flex fretnumber">
                            <ng-container *ngFor="let item of fretsNumber;">
                                <h5> <span class="fret-badge">{{item}}</span></h5>
                            </ng-container>
                        
                        </div>
                    </div>                  
                   
                </div>            
            </div> 
            
        </div>
        
        <div class="row pt-4">
            <div class="col-12">

                <!-- TÓNICA -->
                <div class="selector-block">
                    <div class="selector-block-label">TÓNICA</div>
                    <div class="selector-grid">
                        <ng-container *ngFor="let item of notesSharp; index as i;">
                            <input type="radio" class="btn-check" name="btnradionote" id="btnradionote{{8 + i}}" autocomplete="off" (click)="setNote(item)">
                            <label class="btn btn-outline-secondary" for="btnradionote{{8 + i}}">{{item}}</label>
                        </ng-container>
                    </div>
                </div>

                <!-- ESCALAS -->
                <div class="selector-block">
                    <div class="selector-block-label">ESCALAS</div>
                    <div class="selector-grid">
                        <input type="radio" class="btn-check" name="btnradio" id="btnradio1" autocomplete="off" (click)="getScalesName('ionian')">
                        <label class="btn btn-outline-secondary" for="btnradio1">JÓNICO</label>

                        <input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off" (click)="getScalesName('dorian')">
                        <label class="btn btn-outline-secondary" for="btnradio2">DÓRICO</label>

                        <input type="radio" class="btn-check" name="btnradio" id="btnradio3" autocomplete="off" (click)="getScalesName('phrygian')">
                        <label class="btn btn-outline-secondary" for="btnradio3">FRIGIO</label>

                        <input type="radio" class="btn-check" name="btnradio" id="btnradio4" autocomplete="off" (click)="getScalesName('lydian')">
                        <label class="btn btn-outline-secondary" for="btnradio4">LIDIO</label>

                        <input type="radio" class="btn-check" name="btnradio" id="btnradio5" autocomplete="off" (click)="getScalesName('mixolydian')">
                        <label class="btn btn-outline-secondary" for="btnradio5">MIXOLIDIO</label>

                        <input type="radio" class="btn-check" name="btnradio" id="btnradio6" autocomplete="off" (click)="getScalesName('aeolian')">
                        <label class="btn btn-outline-secondary" for="btnradio6">EÓLICO</label>

                        <input type="radio" class="btn-check" name="btnradio" id="btnradio7" autocomplete="off" (click)="getScalesName('locrian')">
                        <label class="btn btn-outline-secondary" for="btnradio7">LOCRIO</label>

                        <input type="radio" class="btn-check" name="btnradio" id="btnradio8" autocomplete="off" (click)="getScalesName('major pentatonic')">
                        <label class="btn btn-outline-secondary" for="btnradio8">PENT. MAYOR</label>

                        <input type="radio" class="btn-check" name="btnradio" id="btnradio9" autocomplete="off" (click)="getScalesName('minor pentatonic')">
                        <label class="btn btn-outline-secondary" for="btnradio9">PENT. MENOR</label>

                        <input type="radio" class="btn-check" name="btnradio" id="btnradio10" autocomplete="off" (click)="getScalesName('major blues')">
                        <label class="btn btn-outline-secondary" for="btnradio10">BLUES MAYOR</label>

                        <input type="radio" class="btn-check" name="btnradio" id="btnradio11" autocomplete="off" (click)="getScalesName('minor blues')">
                        <label class="btn btn-outline-secondary" for="btnradio11">BLUES MENOR</label>
                    </div>
                </div>

                <!-- ACORDES DE LA PROGRESIÓN -->
                <div class="selector-block" *ngIf="!isArpeggio && currentNote && currentScaleName">
                    <div class="selector-block-label">ACORDES DE LA PROGRESIÓN</div>
                    <div class="selector-grid">
                        <ng-container *ngFor="let chordName of progressionChordNames; index as i">
                            <button class="btn btn-outline-secondary"
                                    [class.active]="isProgressionChord && currentDegree === (i+1)"
                                    [disabled]="chordName === '-'"
                                    (click)="selectProgressionDegree(i+1)">
                                {{ progressionRomanLabels[i] }} · {{ chordName }}
                            </button>
                        </ng-container>
                    </div>
                </div>

                <!-- ARPEGIOS -->
                <div class="selector-block">
                    <div class="selector-block-label">ARPEGIOS</div>
                    <div class="selector-grid">
                        <input type="radio" class="btn-check" name="btnradio" id="btnradio-arp1" autocomplete="off" (click)="getArpeggioName('arp-major')">
                        <label class="btn btn-outline-secondary" for="btnradio-arp1">ARP. MAYOR</label>

                        <input type="radio" class="btn-check" name="btnradio" id="btnradio-arp2" autocomplete="off" (click)="getArpeggioName('arp-minor')">
                        <label class="btn btn-outline-secondary" for="btnradio-arp2">ARP. MENOR</label>

                        <input type="radio" class="btn-check" name="btnradio" id="btnradio-arp3" autocomplete="off" (click)="getArpeggioName('arp-dom7')">
                        <label class="btn btn-outline-secondary" for="btnradio-arp3">7 DOMINANTE</label>

                        <input type="radio" class="btn-check" name="btnradio" id="btnradio-arp4" autocomplete="off" (click)="getArpeggioName('arp-maj7')">
                        <label class="btn btn-outline-secondary" for="btnradio-arp4">maj7 MAYOR</label>

                        <input type="radio" class="btn-check" name="btnradio" id="btnradio-arp5" autocomplete="off" (click)="getArpeggioName('arp-m7')">
                        <label class="btn btn-outline-secondary" for="btnradio-arp5">7b MENOR</label>
                    </div>
                </div>

                <!-- FORMAS DEL ACORDE (progresión o arpeggio) -->
                <div class="selector-block" *ngIf="chordDiagrams.length">
                    <div class="selector-block-label">FORMAS DEL ACORDE</div>
                    <div class="chord-diagram-list">
                        <div class="chord-diagram" *ngFor="let diagram of chordDiagrams; index as shapeIndex">
                            <div class="chord-diagram-header">
                                <span class="chord-diagram-name">{{ chordDiagramLabel }}</span>
                                <span class="chord-diagram-position">{{ diagram.positionLabel || 'Abierto' }}</span>
                            </div>
                            <div class="chord-diagram-markers">
                                <span *ngFor="let m of diagram.markers">{{ m }}</span>
                            </div>
                            <div class="chord-diagram-grid">
                                <div class="chord-diagram-row" *ngFor="let row of diagram.grid">
                                    <div class="chord-diagram-cell" *ngFor="let cell of row">
                                        <span class="chord-diagram-dot"
                                              *ngIf="cell"
                                              [class.dot-root]="cell.degree === 1 && degreeHighlights[1]"
                                              [class.dot-3]="cell.degree === 3 && degreeHighlights[3]"
                                              [class.dot-5]="cell.degree === 5 && degreeHighlights[5]"
                                              [class.dot-7]="cell.degree === 7 && degreeHighlights[7]"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="chord-diagram-labels">
                                <span *ngFor="let l of diagram.stringLabels">{{ l }}</span>
                            </div>
                            <div class="chord-diagram-shape-label">Forma {{ shapeIndex + 1 }}</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
